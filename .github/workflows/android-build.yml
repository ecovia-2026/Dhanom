name: Android CI - Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '9.3.1'

      - name: Make gradlew executable if present
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build debug APK
        # If a Gradle wrapper exists the action will use it; otherwise it will use installed Gradle.
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache --info --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhanomAI-Finance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  upload-existing-apk:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create merged APK package
        run: |
          mkdir -p merged_apks
          cp DhanomAI-Finance-debug.apk merged_apks/ || true
          cp DhanomAI-Finance.apk merged_apks/ || true
          cp DhanomAI-Finance-Downloadable.apk merged_apks/ || true
          # Create a simple manifest describing minimum supported SDK (source minSdk is 24; cannot safely target API 16 because project uses Jetpack Compose which requires minSdk 21+)
          echo "Merged APK bundle for convenience. Source project minSdk: 24 (original)." > merged_apks/README.txt
          zip -r merged_apks.zip merged_apks || true

      - name: Upload merged APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-apks
          path: merged_apks.zip
          retention-days: 7

      - name: Upload existing APK files (individual)
        uses: actions/upload-artifact@v4
        with:
          name: existing-apks
          path: |
            DhanomAI-Finance-debug.apk
            DhanomAI-Finance.apk
            DhanomAI-Finance-Downloadable.apk
          retention-days: 7
