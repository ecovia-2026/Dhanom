name: Android CI - Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '9.3.1'

      - name: Make gradlew executable if present
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build debug APK
        # If a Gradle wrapper exists the action will use it; otherwise it will use installed Gradle.
        run: |
          gradle assembleDebug --no-daemon --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhanomAI-Finance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  upload-existing-apk:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload existing APK files
        uses: actions/upload-artifact@v4
        with:
          name: existing-apks
          path: |
            DhanomAI-Finance-debug.apk
            DhanomAI-Finance.apk
            DhanomAI-Finance-Downloadable.apk
          retention-days: 7
